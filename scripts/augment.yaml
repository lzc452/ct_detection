# Ultralytics YOLOv8 超参数配置 — 针对CT缺陷检测小样本优化
# 使用方法：
#   model.train(data=Config.data_ymal_path, epochs=300, batch=8, 
#               imgsz=640, hyp='augment.yaml', ...)

# ==================== 学习率优化 ====================
lr0: 0.001          # 初始学习率（小样本用更小学习率，防止震荡）
lrf: 0.01           # 最终学习率 = lr0 * lrf
momentum: 0.937     # SGD momentum / Adam beta1
weight_decay: 0.0005  # 权重衰减（正则化，防止过拟合）
warmup_epochs: 3.0  # 预热轮数
warmup_momentum: 0.8 # 预热momentum
warmup_bias_lr: 0.1 # 预热偏置学习率

# ==================== 损失权重 ====================
box: 7.5            # 检测框损失权重
cls: 0.5            # 分类损失权重
dfl: 1.5            # 分布焦点损失权重
pose: 12.0          # 姿态损失权重
kobj: 1.0           # 关键点目标损失

# ==================== 数据增强 — 针对CT图像特别调整 ====================

# --- 几何变换（必须轻，CT缺陷位置不能过度扭曲）---
degrees: 5.0        # 随机旋转角度 ±5°（够了，太大缺陷位置会偏）
translate: 0.05     # 随机平移 5%（轻度）
scale: 0.05         # 随机缩放 5%（轻度）
shear: 0.0          # 切变 — 禁用！CT图像不能形变
perspective: 0.0    # 透视变换 — 禁用！CT不能透视变形

# --- 翻转（CT图像通常有方向性）---
flipud: 0.0         # 上下翻转概率 — 禁用（CT图产品有上下方向）
fliplr: 0.5         # 左右翻转概率 50%（通常OK）

# --- HSV色彩增强（CT是灰度图，主要用亮度）---
hsv_h: 0.0          # 色调 — 禁用（灰度图没有色调）
hsv_s: 0.0          # 饱和度 — 禁用（灰度图没有饱和度）
hsv_v: 0.2          # 亮度变化 20%（对CT暗斑/亮斑检测有效）

# --- Mosaic & MixUp（小样本必开）---
mosaic: 1.0          # Mosaic增强概率 100%（小样本神器，必须开）
mixup: 0.1          # MixUp概率 10%（轻度混合，灰度图有效）
copy_paste: 0.0      # 复制粘贴 — 禁用（缺陷位置不能随意复制）
auto_augment: randaugment  # 自动增强策略
erasing: 0.0         # 随机擦除 — 禁用（会擦掉缺陷）
crop_fraction: 1.0   # 裁剪比例（保持原图）

# ==================== 图像预处理参数 ====================
# 这些参数在 ct_preprocess.py 中手动控制，训练时可以在 
# 数据集加载前使用 preprocess_dataset_images() 预处理
# 推荐训练前对 train/val 都跑一次预处理，生成增强版数据集

# ==================== 其他训练参数 ====================
close_mosaic: 10     # 最后10轮关闭Mosaic（稳定训练）
